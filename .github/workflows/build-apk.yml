
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o samaneh_madares_bartar_android_project.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android_project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samaneh-Madares-Bartar-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          
